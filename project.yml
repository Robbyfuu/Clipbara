name: Clipbara
options:
  bundleIdPrefix: com.minsang
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.2.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.7.0"

targets:
  # Developer ID / DMG distribution (Sparkle auto-updates, non-sandboxed dist build)
  Clipbara:
    type: application
    platform: macOS
    sources:
      - path: Clipbara
        excludes:
          - "Info-MAS.plist"
    resources:
      - Clipbara/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minsang.PasteClip
        PRODUCT_NAME: Clipbara
        INFOPLIST_FILE: Clipbara/Info.plist
        CODE_SIGN_ENTITLEMENTS: Clipbara/Clipbara.entitlements
        GENERATE_INFOPLIST_FILE: false
        ENABLE_HARDENED_RUNTIME: "YES"
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
        product: Sparkle
    entitlements:
      path: Clipbara/Clipbara.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true

  # Mac App Store distribution (sandboxed, no Sparkle)
  ClipbaraMAS:
    type: application
    platform: macOS
    sources:
      - path: Clipbara
        excludes:
          - "Info.plist"
      # Local StoreKit testing only. Listed so Xcode can open it; never bundled.
      - path: StoreKit/Clipbara.storekit
        buildPhase: none
    resources:
      - Clipbara/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robbyfuu.copyd
        PRODUCT_NAME: Copyd
        INFOPLIST_FILE: Clipbara/Info-MAS.plist
        CODE_SIGN_ENTITLEMENTS: Clipbara/Clipbara-MAS.entitlements
        GENERATE_INFOPLIST_FILE: false
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "APPSTORE CLOUDSYNC $(inherited)"
        ENABLE_APP_SANDBOX: "YES"
        DEVELOPMENT_TEAM: TQC76W2BKK
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: KeyboardShortcuts
    entitlements:
      path: Clipbara/Clipbara-MAS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.developer.icloud-container-identifiers: [iCloud.com.robbyfuu.copyd]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.aps-environment: development
    scheme:
      # Run with the local StoreKit products (trial + lifetime) instead of the sandbox.
      storeKitConfiguration: StoreKit/Clipbara.storekit
      # Debug-only trial switches, off by default. Tick them in Edit Scheme > Run > Arguments.
      commandLineArguments:
        "-ClipbaraDebugOriginalAppVersion 1.4": false
        "-ClipbaraDebugTrialShiftDays 8": false

  # Unhosted unit tests: no app launch, clipboard monitor, or user store access.
  ClipbaraTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Clipbara/Utilities/PanelTabShortcut.swift
      - path: Clipbara/Utilities/QuickPasteShortcut.swift
      - path: Clipbara/Utilities/PinboardDot.swift
      - path: Clipbara/Utilities/WheelScrollTranslation.swift
      - path: Clipbara/Utilities/ReviewPromptPolicy.swift
      - path: Clipbara/Utilities/AccessPolicy.swift
      - path: Clipbara/Utilities/Thumbnail.swift
      - path: Clipbara/Sync/AssetCrypto.swift
      - path: Clipbara/Sync/SyncRecordMapper.swift
      - path: Clipbara/Sync/DuplicateRule.swift
      - path: Clipbara/Sync/SyncBatchPlanner.swift
      - path: Clipbara/Models
      - path: Clipbara/Sync/ModelSnapshots.swift
      - path: Clipbara/Sync/LocalChangeTracker.swift
      - path: Clipbara/Sync/RemoteApplier.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minsang.ClipbaraTests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_STRICT_CONCURRENCY: complete
    scheme:
      testTargets:
        - ClipbaraTests

name: Copyd
options:
  bundleIdPrefix: com.robbyfuu
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.2.0"

targets:
  # Mac App Store distribution (sandboxed)
  Copyd:
    type: application
    platform: macOS
    sources:
      - path: Copyd
      - path: Shared
      # Local StoreKit testing only. Listed so Xcode can open it; never bundled.
      - path: StoreKit/Copyd.storekit
        buildPhase: none
    resources:
      - Copyd/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robbyfuu.copyd
        PRODUCT_NAME: Copyd
        INFOPLIST_FILE: Copyd/Info.plist
        CODE_SIGN_ENTITLEMENTS: Copyd/Copyd.entitlements
        GENERATE_INFOPLIST_FILE: false
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
        ENABLE_APP_SANDBOX: "YES"
        DEVELOPMENT_TEAM: TQC76W2BKK
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: KeyboardShortcuts
    entitlements:
      path: Copyd/Copyd.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.developer.icloud-container-identifiers: [iCloud.com.robbyfuu.copyd]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.aps-environment: development
    scheme:
      # Run with the local StoreKit products (trial + lifetime) instead of the sandbox.
      storeKitConfiguration: StoreKit/Copyd.storekit
      # Debug-only trial switches, off by default. Tick them in Edit Scheme > Run > Arguments.
      commandLineArguments:
        "-CopydDebugOriginalAppVersion 1.4": false
        "-CopydDebugTrialShiftDays 8": false

  # Unhosted unit tests: no app launch, clipboard monitor, or user store access.
  CopydTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Copyd/Utilities/PanelGeometry.swift
      - path: Copyd/Utilities/PanelTabShortcut.swift
      - path: Copyd/Utilities/QuickPasteShortcut.swift
      - path: Shared/Design/PinboardDot.swift
      - path: Copyd/Utilities/WheelScrollTranslation.swift
      - path: Copyd/Utilities/ReviewPromptPolicy.swift
      - path: Copyd/Utilities/AccessPolicy.swift
      - path: Shared/Utilities/Thumbnail.swift
      - path: Shared/Sync/AssetCrypto.swift
      - path: Shared/Sync/SyncRecordMapper.swift
      - path: Shared/Sync/DuplicateRule.swift
      - path: Shared/Sync/SyncBatchPlanner.swift
      - path: Shared/Models
      - path: Shared/Sync/ModelSnapshots.swift
      - path: Shared/Sync/LocalChangeTracker.swift
      - path: Shared/Sync/RemoteApplier.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robbyfuu.copyd.tests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_STRICT_CONCURRENCY: complete
    scheme:
      testTargets:
        - CopydTests
